apiVersion: apps/v1
kind: Deployment
metadata:
  name: queueflow-api-server
  namespace: queueflow
  labels:
    app.kubernetes.io/name: api-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: queueflow-api-server
  template:
    metadata:
      labels:
        app: queueflow-api-server
    spec:
      containers:
        - name: api-server
          image: ghcr.io/queueflow/api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: queueflow-config
            - secretRef:
                name: queueflow-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-server-service
  namespace: queueflow
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app: queueflow-api-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-server-hpa
  namespace: queueflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queueflow-api-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
